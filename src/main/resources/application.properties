spring.application.name=coupon-service
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:coupon}
spring.datasource.username=${POSTGRES_USER:coupon}
spring.datasource.password=${POSTGRES_PASSWORD:coupon}

# X-Forwarded-For is honored only when the request comes from a trusted (internal) proxy
server.forward-headers-strategy=native

geolocation.base-url=https://ipapi.co
geolocation.connect-timeout=2s
geolocation.read-timeout=5s
geolocation.cache.ttl=1h
geolocation.cache.maximum-size=10000
